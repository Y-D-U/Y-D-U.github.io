<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
}

.card {
    background: white;
    padding: 40px 60px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

h1 {
    color: #e63946;
}

.buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 20px;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    font-size: 18px;
    cursor: pointer;
}

#yesBtn {
    background: #ff4d6d;
    color: white;
}

#yesBtn:hover {
    transform: scale(1.1);
}

#noBtn {
    background: #adb5bd;
    color: white;
    position: relative;
}

#message {
    display: none;
    font-size: 22px;
    color: #e63946;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">
    <h1>Will you be my special friend for Valentine's? ❤️</h1>

    <div class="buttons">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 😢</button>
    </div>

    <div id="message">YAYYY!!! Redirecting... 💕</div>
</div>

<script>
// NO button runs away
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// YES click → show message then redirect
document.getElementById("yesBtn").onclick = () => {
    document.getElementById("message").style.display = "block";

    setTimeout(() => {
        window.location.href = "https://youtu.be/no-qHC_DdIg?si=dYGGb02WpJ3f7Mso";
    }, 1200);
};
</script>

</body>
</html>
