<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        height: 100vh;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        overflow: hidden;
    }

    /* Animated background circles */
    .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255,255,255,0.05);
        animation: float 20s infinite linear;
    }

    .circle:nth-child(1) {
        width: 300px;
        height: 300px;
        top: -50px;
        left: -50px;
    }

    .circle:nth-child(2) {
        width: 200px;
        height: 200px;
        bottom: -40px;
        right: -40px;
        animation-duration: 25s;
    }

    @keyframes float {
        0% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-40px) rotate(180deg); }
        100% { transform: translateY(0) rotate(360deg); }
    }

    .container {
        text-align: center;
        backdrop-filter: blur(15px);
        background: rgba(255,255,255,0.05);
        padding: 50px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        animation: fadeIn 1.5s ease;
        max-width: 500px;
        width: 90%;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        font-size: 2.8rem;
        margin-bottom: 10px;
        font-weight: 600;
    }

    p {
        font-size: 1.1rem;
        margin-bottom: 30px;
        color: #ddd;
    }

    .countdown {
        display: flex;
        justify-content: space-between;
        margin-bottom: 30px;
    }

    .time-box {
        background: rgba(255,255,255,0.08);
        padding: 15px;
        border-radius: 12px;
        width: 22%;
    }

    .time-box span {
        display: block;
        font-size: 1.8rem;
        font-weight: 600;
    }

    .time-box small {
        font-size: 0.8rem;
        color: #bbb;
    }

    .notify {
        display: flex;
        gap: 10px;
    }

    .notify input {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        outline: none;
    }

    .notify button {
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        background: #00c6ff;
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .notify button:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    footer {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #aaa;
    }
</style>
</head>
<body>

<div class="circle"></div>
<div class="circle"></div>

<div class="container">
    <h1>🚧 Under Construction</h1>
    <p>We're working hard to launch something amazing. Stay tuned!</p>

    <div class="countdown">
        <div class="time-box">
            <span id="days">00</span>
            <small>Days</small>
        </div>
        <div class="time-box">
            <span id="hours">00</span>
            <small>Hours</small>
        </div>
        <div class="time-box">
            <span id="minutes">00</span>
            <small>Minutes</small>
        </div>
        <div class="time-box">
            <span id="seconds">00</span>
            <small>Seconds</small>
        </div>
    </div>

    <div class="notify">
        <input type="email" placeholder="Enter your email">
        <button onclick="notifyUser()">Notify Me</button>
    </div>

    <footer>©2026 Y-D-U</footer>
